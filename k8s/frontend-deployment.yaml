apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: airway-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airway-frontend
  template:
    metadata:
      labels:
        app: airway-frontend
    spec:
      containers:
      - name: frontend
        image: airway-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        env:
        - name: VITE_API_BASE_URL
          value: "http://localhost:8000/api"
