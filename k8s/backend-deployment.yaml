apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: airway-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airway-backend
  template:
    metadata:
      labels:
        app: airway-backend
    spec:
      containers:
      - name: backend
        image: airway-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
